name: Publicar Podcast Lab no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  # Proteção temporária: se o deploy legado do Pages/Jekyll ainda disparar
  # após o push, republicar o build Vite assim que ele terminar.
  # Remover quando o Pages estiver usando somente GitHub Actions.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: podcast-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js no GitHub
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar frontend
        run: npm run test
      - name: Compilar sem a API do Aulas
        env:
          VITE_AULAS_API_URL: ""
        run: npm run build
      # O GitHub ainda pode usar seu fluxo Jekyll legado, que só publica
      # arquivos do repositório. Gerar também index.html + assets na raiz
      # evita que esse deploy substitua a aplicação por código-fonte.
      - name: Sincronizar aplicação compilada para publicação legada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf ../../assets
          cp -R dist/assets ../../assets
          cp dist/index.html ../../index.html
          touch ../../.nojekyll
          cd ../..
          git add -A -- assets index.html .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "build(podcast): disponibilizar site pronto para GitHub Pages [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos públicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
