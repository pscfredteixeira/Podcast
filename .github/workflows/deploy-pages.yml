name: Publicar Podcast Lab no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  # Proteção temporária: se o deploy legado do Pages/Jekyll ainda disparar
  # após o push, republicar o build Vite assim que ele terminar.
  # Remover quando o Pages estiver usando somente GitHub Actions.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: podcast-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js no GitHub
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar frontend
        run: npm run test
      - name: Compilar sem a API do Aulas
        env:
          VITE_AULAS_API_URL: ""
        run: npm run build
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos públicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
